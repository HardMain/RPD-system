version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rpd_db
      POSTGRES_USER: rpd_user
      POSTGRES_PASSWORD: rpd_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpd_user -d rpd_db"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rpd_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rpd_minio_secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fI", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rpd_user:rpd_secret@db:5432/rpd_db
      LLM_API_KEY: ${LLM_API_KEY:-demo}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_DEBUG: ${LLM_DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:-super-secret-dev-key-change-in-prod}
      UPLOAD_DIR: /app/uploads
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_BUCKET: ${S3_BUCKET:-rpd-files}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-rpd_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-rpd_minio_secret}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  uploads:
  minio-data:
